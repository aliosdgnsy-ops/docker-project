# todo-docker-angular/frontend/nginx.conf
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # /api -> backend
  location /api/ {
    proxy_pass http://backend:3000/api/;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }

  # Angular route'ları
  location / {
    try_files $uri $uri/ /index.html;
  }
}
