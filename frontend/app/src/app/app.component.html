<!-- todo-docker-angular/frontend/app/src/app/app.component.html -->
<div class="container" style="max-width:680px;margin:40px auto;font-family:system-ui;">
  <h1>{{ title }}</h1>

  <form (submit)="$event.preventDefault(); add()" style="display:flex; gap:8px; margin-bottom:16px;">
    <input [(ngModel)]="newTitle" name="title" placeholder="Yeni görev..." style="flex:1;padding:8px;">
    <button type="submit" style="padding:8px 12px;">Ekleme yap</button>
  </form>

  <p *ngIf="loading">Yükleniyor...</p>

  <ul style="list-style:none;padding:0;display:flex;flex-direction:column;gap:8px;">
    <li *ngFor="let todo of todos" style="display:flex;align-items:center;gap:8px;border:1px solid #ddd;padding:8px;border-radius:8px;">
      <input type="checkbox" [checked]="todo.completed" (change)="toggle(todo)">
      <input [(ngModel)]="todo.title" name="t{{todo.id}}" (blur)="save(todo)" style="flex:1;padding:6px;border:1px solid #ccc;border-radius:6px;">
      <button (click)="remove(todo)">Sil</button>
    </li>
  </ul>
</div>
